services:
  db:
    image: postgres:16
    container_name: inovatic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inovatic
      POSTGRES_USER: inovatic
      POSTGRES_PASSWORD: inovatic_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - inovatic_pgdata:/var/lib/postgresql/data
    networks:
      - inovatic_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inovatic -d inovatic"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    build:
      context: ./docker/pgadmin
      dockerfile: Dockerfile
    container_name: inovatic-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inovatic.hr
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - inovatic_pgadmin:/var/lib/pgadmin
    networks:
      - inovatic_net
    depends_on:
      db:
        condition: service_healthy

  # Local e-mail catcher: every mail the dev app sends shows up at
  # http://localhost:8025 instead of reaching anyone. See emails/README.md.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: inovatic-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 2000
    ports:
      - "8025:8025"
    volumes:
      - inovatic_mailpit:/data
    networks:
      - inovatic_net

  # Speaks the Resend HTTP API and delivers into Mailpit. The app is pointed at
  # it with RESEND_BASE_URL=http://localhost:3025 in .env.local — nothing in
  # the sending code changes.
  resend-relay:
    image: node:22-alpine
    container_name: inovatic-resend-relay
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: 3025
      MAILPIT_URL: http://mailpit:8025
    ports:
      - "3025:3025"
    volumes:
      - ./docker/resend-relay:/app:ro
    networks:
      - inovatic_net
    depends_on:
      - mailpit

volumes:
  inovatic_pgdata:
  inovatic_pgadmin:
  inovatic_mailpit:

networks:
  inovatic_net:
    driver: bridge
