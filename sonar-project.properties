sonar.projectKey=inovatic
sonar.projectName=Inovatic
sonar.projectVersion=0.1.0

# Sources
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts

# Exclusions (generated, seed data, migration scripts, false positives)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/prisma/seed.ts,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/src/app/globals.css,\
  **/src/components/ui/form.tsx,\
  **/src/components/ui/carousel.tsx,\
  **/src/components/ui/table.tsx

# Accepted issues (owner Won't-Fix, 2026-08-03) — kept here rather than as
# dashboard state so the decision is versioned and survives a server rebuild.
# e1/e2: the one-shot workbook importers are deliberate row-scanning parsers,
#        spec'd by the synthetic-workbook tests; splitting re-raises risk
#        (S3776 cognitive complexity, S2310 loop-counter assignment).
# e3:    the /donacije promo video has no captions track — a content decision,
#        not a code fix (S4084).
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/lib/import-*/**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2310
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/lib/import-*/**
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4084
sonar.issue.ignore.multicriteria.e3.resourceKey=**/src/app/(public)/donacije/page.tsx

# TypeScript
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Host — SonarQube running locally in Docker
sonar.host.url=http://localhost:9000

# Token — set via SONAR_TOKEN env var when running the scanner
# e.g.: SONAR_TOKEN=your_token npm run sonar:scan
